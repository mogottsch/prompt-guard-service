name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

      - name: Run lint
        run: uv run ruff check .

  build-image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide publication eligibility
        id: publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)
          event, ref = os.environ['EVENT_NAME'], os.environ['REF']
          before, head = os.environ['BEFORE'], os.environ['HEAD_SHA']
          allowed = False
          try:
              # Unknown history fails closed; explicit releases/manual runs retain authority.
              known_head = bool(re.fullmatch(r'[0-9a-f]{40}', head)) and git('rev-parse', 'HEAD').decode().strip() == head
              trusted = os.environ['REPOSITORY'] == 'mogottsch/prompt-guard-service' and known_head
              if trusted and event in ('push', 'workflow_dispatch') and ref.startswith('refs/tags/v'):
                  allowed = True
              elif trusted and event == 'workflow_dispatch' and ref == 'refs/heads/main':
                  allowed = True
              elif trusted and event == 'push' and ref == 'refs/heads/main' and re.fullmatch(r'[0-9a-f]{40}', before) and before != '0' * 40:
                  git('merge-base', '--is-ancestor', before, head)
                  changed = git('diff', '--name-only', '-z', '--no-renames', before, head, '--').split(b'\0')
                  ignored = {b'renovate.json', b'.github/workflows/ci.yml', b''}
                  allowed = any(name not in ignored for name in changed)
          except subprocess.CalledProcessError:
              allowed = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'allowed={str(allowed).lower()}\n')
          PY

      - name: Log in to GHCR
        if: steps.publication.outputs.allowed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=prompt-guard-service
            org.opencontainers.image.description=FastAPI service for Prompt Guard ONNX inference
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.publication.outputs.allowed == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: steps.publication.outputs.allowed == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
